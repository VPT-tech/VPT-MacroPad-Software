<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Завантажити VPT MacroPad Software</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #0d1117;
      color: #c9d1d9;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      max-width: 440px;
      width: 100%;
    }
    h1 {
      margin: 0 0 10px 0;
      font-size: 22px;
      color: #f0f6fc;
    }
    .subtitle {
      color: #8b949e;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .info {
      color: #58a6ff;
      font-size: 14px;
      margin-bottom: 20px;
      min-height: 20px;
    }
    .btn {
      display: inline-block;
      background-color: #238636;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      padding: 14px 24px;
      border-radius: 6px;
      transition: background-color 0.2s, opacity 0.2s;
      word-break: break-all;
    }
    .btn:hover {
      background-color: #2ea043;
    }
    .btn.disabled {
      background-color: #21262d;
      color: #8b949e;
      border: 1px solid #30363d;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>VPT MacroPad Software</h1>
    <div class="subtitle">Офіційне програмне забезпечення</div>
    
    <div id="status" class="info">Пошук останньої версії...</div>
    
    <a id="download-btn" class="btn disabled" href="#">Завантажити .exe</a>
  </div>

  <script>
    const GITHUB_USER = 'VPT-tech';
    const GITHUB_REPO = 'VPT-MacroPad-Software';

    async function fetchLatestRelease() {
      const statusEl = document.getElementById('status');
      const btnEl = document.getElementById('download-btn');

      try {
        const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/releases/latest`);
        
        if (!response.ok) {
          throw new Error('Не вдалося отримати дані релізу');
        }
        
        const data = await response.json();
        
        // Шукаємо файл з розширенням .exe
        const exeAsset = data.assets.find(asset => asset.name.toLowerCase().endsWith('.exe'));

        if (exeAsset) {
          btnEl.href = exeAsset.browser_download_url;
          btnEl.textContent = `Завантажити ${exeAsset.name}`;
          btnEl.classList.remove('disabled');
          
          const sizeMb = (exeAsset.size / (1024 * 1024)).toFixed(1);
          statusEl.textContent = `Версія: ${data.tag_name} (${sizeMb} MB)`;
        } else {
          btnEl.href = data.html_url;
          btnEl.textContent = 'Перейти до релізу на GitHub';
          btnEl.classList.remove('disabled');
          statusEl.textContent = `Версія ${data.tag_name} (файл .exe не знайдено)`;
        }
      } catch (err) {
        statusEl.textContent = 'Останній реліз знайдено на GitHub';
        btnEl.href = `https://github.com/${GITHUB_USER}/${GITHUB_REPO}/releases/latest`;
        btnEl.textContent = 'Відкрити сторінку релізу';
        btnEl.classList.remove('disabled');
      }
    }

    fetchLatestRelease();
  </script>
</body>
</html>
